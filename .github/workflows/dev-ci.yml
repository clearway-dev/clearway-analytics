name: CI Dev

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Backend linting — ruff catches syntax errors and style violations fast
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # E9xx = syntax/runtime errors, F = pyflakes — these are hard failures.
        # Extend with full rule set once the codebase is clean.
        run: ruff check ./backend --select E9,F --output-format=github

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend linting + TypeScript type check
  # ────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: ./frontend
        # tsc -b runs the full project build check without emitting files
        run: npx tsc -b --noEmit

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Dry-run Docker builds — verify Dockerfiles are not broken
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker dry-run builds
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          build-args: |
            VITE_API_URL=https://api.clearway.zephyron.tech

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Integration tests against the pre-seeded golden database image
  # ────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend integration tests (pytest)
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 15
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Log in so the runner can pull the private golden image from GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull and start the golden image. Using docker run (not a service container)
      # so we can build the image name with lowercase conversion inline.
      - name: Start golden DB
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/clearway-db-seeded:latest
          docker run -d \
            --name clearway-test-db \
            -p 5432:5432 \
            $IMAGE

      - name: Wait for DB to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec clearway-test-db pg_isready -U clearway && break
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest pytest-mock httpx

      - name: Run integration tests
        working-directory: ./backend
        run: pytest tests/integration -v
        env:
          DATABASE_URL: postgresql://clearway:clearway_dev_password@localhost:5432/clearway
          # SECRET_KEY only needs to be consistent — auth deps are overridden in conftest.
          SECRET_KEY: ci-test-secret-key
