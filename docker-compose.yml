services:
  # ---------------------------------------------------------------------------
  # BACKEND MCP SERVICE (FastMCP)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ./backend
    container_name: clearway-analytics-mcp
    command: fastmcp run app/mcp/server.py:mcp --transport sse --port 8001 --host 0.0.0.0
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    env_file:
      - .env

  # ---------------------------------------------------------------------------
  # BACKEND SERVICE (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build: 
      context: ./backend
    container_name: clearway-analytics-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # We construct the connection string dynamically from .env variables
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Load env variables specifically for this service (optional but good practice)
    env_file:
      - .env

  # ---------------------------------------------------------------------------
  # FRONTEND SERVICE (React + Vite)
  # ---------------------------------------------------------------------------
  web:
    build: 
      context: ./frontend
    container_name: clearway-analytics-web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api
    env_file:
      - .env